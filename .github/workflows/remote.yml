name: Remote simulator

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Тег или ветка приложения (lab1, lab2, lab3, lab4, main)"
        default: "main"
      device:
        description: "Устройство: iPhone 16 Pro или iPad Pro 13-inch (M4)"
        default: "iPhone 16 Pro"
      minutes:
        description: "Сколько минут держать сеанс (до 300)"
        default: "60"

permissions:
  contents: write

jobs:
  remote:
    runs-on: macos-15
    timeout-minutes: 330
    steps:
      - name: Checkout tools
        uses: actions/checkout@v4

      - name: Checkout app
        uses: actions/checkout@v4
        with:
          repository: dezshev/RPiPiP-InventoryQR
          ref: ${{ github.event.inputs.ref }}
          path: app

      - name: Build app for simulator
        working-directory: app
        run: |
          brew install xcodegen >/dev/null
          xcodegen generate
          xcodebuild build -project InventoryQR.xcodeproj -scheme InventoryQR \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || { tail -40 build.log; exit 1; }

      - name: Install tools
        run: |
          brew install cliclick cloudflared >/dev/null
          pip3 install --break-system-packages pillow >/dev/null 2>&1 || pip3 install pillow >/dev/null

      - name: Start simulator with the app
        env:
          DEVICE: ${{ github.event.inputs.device }}
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 "$DEVICE (" | grep -Eo '[0-9A-F-]{36}')
          [ -z "$UDID" ] && UDID=$(xcrun simctl list devices available | grep -m1 "iPhone 16 Pro (" | grep -Eo '[0-9A-F-]{36}')
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" app/build/Build/Products/Debug-iphonesimulator/InventoryQR.app
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          defaults write com.apple.iphonesimulator ShowChrome -bool false
          open -a Simulator --args -CurrentDeviceUDID "$UDID"
          sleep 8
          xcrun simctl launch "$UDID" by.gstu.itp.InventoryQR
          osascript -e 'tell application "System Events" to tell process "Simulator" to get {position, size} of front window' || true
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Web access
        env:
          SIM_PASSWORD: ${{ secrets.VNC_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          T=$RUNNER_TEMP
          nohup python3 server/websim.py "$UDID" 8080 "$SIM_PASSWORD" > "$T/websim.log" 2>&1 &
          sleep 5
          curl -s -o /dev/null -w "local server: %{http_code}\n" -u "demo:$SIM_PASSWORD" http://127.0.0.1:8080/
          nohup cloudflared tunnel --no-autoupdate --protocol http2 --url http://127.0.0.1:8080 > "$T/cloudflared.log" 2>&1 &
          for i in $(seq 1 60); do
            URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$T/cloudflared.log" | head -1)
            [ -n "$URL" ] && break; sleep 2
          done
          mkdir -p link && echo "$URL" > link/link.txt
          D=$(mktemp -d)
          ( cd "$D" && git init -q -b session && git config user.name "github-actions" && git config user.email "actions@github.com" \
            && { echo "# Текущий сеанс"; echo; echo "$URL"; echo; echo "Логин: любой, пароль — выдан владельцем репозитория."; } > README.md \
            && git add README.md && git commit -q -m "Ссылка на сеанс" \
            && git push -q -f "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" session:session ) || true
          echo "$URL"

      - name: Publish link
        uses: actions/upload-artifact@v4
        with:
          name: link
          path: link/link.txt

      - name: Keep session alive
        run: |
          M=${{ github.event.inputs.minutes }}
          [ "$M" -gt 300 ] && M=300
          END=$(( $(date +%s) + M * 60 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            pgrep -f websim.py >/dev/null || { echo "$(date) сервер упал"; tail -20 "$RUNNER_TEMP/websim.log"; break; }
            sleep 30
          done
          echo "--- websim"; tail -40 "$RUNNER_TEMP/websim.log"
          echo "--- cloudflared"; tail -20 "$RUNNER_TEMP/cloudflared.log"
