name: Remote simulator

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Тег или ветка приложения (lab1, lab2, lab3, lab4, main)"
        default: "main"
      minutes:
        description: "Сколько минут держать сеанс (до 300)"
        default: "60"

permissions:
  contents: write

jobs:
  remote:
    runs-on: macos-15
    timeout-minutes: 330
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          repository: dezshev/RPiPiP-InventoryQR
          ref: ${{ github.event.inputs.ref }}

      - name: Build app for simulator
        run: |
          brew install xcodegen >/dev/null
          xcodegen generate
          xcodebuild build -project InventoryQR.xcodeproj -scheme InventoryQR \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || { tail -40 build.log; exit 1; }

      - name: Start simulators with the app
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/InventoryQR.app
          pick() { xcrun simctl list devices available | grep -m1 "$1" | grep -Eo '[0-9A-F-]{36}'; }
          PHONE=$(pick "iPhone 16 Pro (")
          xcrun simctl boot "$PHONE"
          xcrun simctl bootstatus "$PHONE" -b
          xcrun simctl install "$PHONE" "$APP"
          xcrun simctl status_bar "$PHONE" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          open -a Simulator
          sleep 5
          xcrun simctl launch "$PHONE" by.gstu.itp.InventoryQR -seedSampleData
          echo "PHONE=$PHONE" >> "$GITHUB_ENV"

      - name: Enable screen sharing
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          # macOS предлагает авторизацию Apple (логин и пароль) — создаём отдельного пользователя demo
          sudo sysadminctl -addUser demo -fullName "Demo" -password "$VNC_PASSWORD" -admin
          K=/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart
          sudo $K -configure -allowAccessFor -specifiedUsers >/dev/null
          sudo $K -configure -users demo,$USER -access -on -privs -all >/dev/null
          sudo $K -configure -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "$VNC_PASSWORD" >/dev/null
          sudo $K -restart -agent -console >/dev/null
          sudo $K -activate >/dev/null
          sleep 5
          python3 - <<'PY'
          import socket
          s = socket.create_connection(("127.0.0.1", 5900), timeout=10)
          print("server:", s.recv(12))
          s.sendall(b"RFB 003.008\n")
          n = s.recv(1)[0]
          print("security types:", list(s.recv(n)))
          PY

      - name: Diagnostics
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          csrutil status || true
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "select client, service, auth_value from access where service in ('kTCCServiceScreenCapture','kTCCServicePostEvent','kTCCServiceAccessibility');" || true
          pip3 install --break-system-packages vncdotool >/dev/null 2>&1 || pip3 install vncdotool >/dev/null
          mkdir -p diag
          timeout 60 vncdo -s 127.0.0.1::5900 -p "$VNC_PASSWORD" capture diag/vnc_capture.png && echo "захват через VNC выполнен" || echo "захват через VNC не удался"
          screencapture -x diag/screencapture.png || true

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: diag
          path: diag

      - name: Browser access (noVNC + Cloudflare tunnel)
        run: |
          brew install cloudflared >/dev/null
          pip3 install --break-system-packages websockify >/dev/null 2>&1 || pip3 install websockify >/dev/null
          git clone -q --depth 1 https://github.com/novnc/noVNC.git "$RUNNER_TEMP/novnc"
          cat > "$RUNNER_TEMP/tunnel.sh" <<'SH'
          #!/bin/bash
          # Запуск прокси noVNC и туннеля; ссылка пишется в link/link.txt и в ветку session репозитория
          T=$RUNNER_TEMP
          pkill -f websockify; pkill -f cloudflared
          nohup websockify --web "$T/novnc" 6080 127.0.0.1:5900 >> "$T/websockify.log" 2>&1 &
          : > "$T/cloudflared.log"
          nohup cloudflared tunnel --no-autoupdate --protocol http2 --url http://127.0.0.1:6080 > "$T/cloudflared.log" 2>&1 &
          for i in $(seq 1 60); do
            URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$T/cloudflared.log" | head -1)
            [ -n "$URL" ] && break; sleep 2
          done
          LINK="$URL/vnc.html?autoconnect=1&resize=scale"
          mkdir -p "$GITHUB_WORKSPACE/link" && echo "$LINK" > "$GITHUB_WORKSPACE/link/link.txt"
          D=$(mktemp -d); cd "$D"
          git init -q -b session && git config user.name "github-actions" && git config user.email "actions@github.com"
          { echo "# Текущий сеанс"; echo; echo "$LINK"; echo; echo "Имя пользователя: demo"; } > README.md
          git add README.md && git commit -q -m "Ссылка на сеанс"
          git push -q -f "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" session:session
          echo "$LINK"
          SH
          chmod +x "$RUNNER_TEMP/tunnel.sh"
          "$RUNNER_TEMP/tunnel.sh"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish link
        uses: actions/upload-artifact@v4
        with:
          name: link
          path: link/link.txt

      - name: Keep session alive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          M=${{ github.event.inputs.minutes }}
          [ "$M" -gt 300 ] && M=300
          END=$(( $(date +%s) + M * 60 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            if ! pgrep -f cloudflared >/dev/null || grep -q "Unregistered tunnel connection\|failed to serve tunnel" "$RUNNER_TEMP/cloudflared.log"; then
              echo "$(date) туннель перезапускается"; tail -15 "$RUNNER_TEMP/cloudflared.log"
              "$RUNNER_TEMP/tunnel.sh"
            fi
            pgrep -f websockify >/dev/null || { echo "$(date) websockify упал"; tail -15 "$RUNNER_TEMP/websockify.log"; "$RUNNER_TEMP/tunnel.sh"; }
            sleep 30
          done
          echo "--- cloudflared"; tail -40 "$RUNNER_TEMP/cloudflared.log"
          echo "--- websockify"; tail -40 "$RUNNER_TEMP/websockify.log"
